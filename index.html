<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Corridor of Cups</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LAYER 1: Background -->
    <div id="background-layer" class="layer"></div>

    <!-- LAYER 2: Devililia and the Desk -->
    <div id="desk-layer" class="layer">
        <img src="assets/deskwithorb.png" id="desk-image" alt="Devililia at her desk">
    </div>

    <!-- LAYER 3: The Active Game Area (Orb) -->
    <div id="mote-container" class="layer">
        <img src="assets/orb.png" id="crystal-orb" alt="Aether Dial">
    </div>

    <!-- LAYER 4: The User Interface -->
    <div id="ui-layer" class="layer">
        <div id="currency-display">
            <h2>Echoes: <span id="echo-count">0</span></h2>
            <p id="echo-rate">0 / sec</p>
        </div>

        <div id="shop-container">
            <h3>The Aether Machine</h3>
            <div class="shop-grid" id="shop-items">
                <!-- Shop items injected via JS -->
            </div>
        </div>
    </div>

    <!-- LAYER 5: The Tarot Reading (Hidden by default) -->
    <div id="tarot-layer" class="layer hidden">
        <img src="assets/top-viewoftable.png" id="tarot-bg" alt="Top view of table">
        
        <!-- The 3 Cards -->
        <div id="card-container">
            <div class="tarot-card" id="card-1">
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front">The High Priestess</div>
                </div>
            </div>
            <div class="tarot-card" id="card-2">
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front">The Tower</div>
                </div>
            </div>
            <div class="tarot-card" id="card-3">
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front">The Fool</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
